titulo: Diálogo tectónico
tecnica: Ensamblada y tallada
texto: |-
  Esta obra nace de una búsqueda de equilibrio entre tres materias de naturalezas opuestas.
  La pieza se ancla al espacio sobre una base de piedra caliza tratada, manteniendo intencionadamente los pies en la tierra para dar asentamiento a la estructura. De este bloque pétreo se eleva una carcasa de madera de contornos orgánicos que envuelve el vacío y aporta calidez visual al conjunto. En su interior, atravesando el aire suspendido, un corazón de acero frío articula el eje central de la escultura, sosteniendo la tensión justa entre lo industrial, lo vegetal y lo mineral.

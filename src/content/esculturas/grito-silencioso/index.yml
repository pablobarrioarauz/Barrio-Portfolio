titulo: Grito silencioso
tecnica: Ensambada
texto: |-
  Esta pieza condensa una gran tensión expresiva en un formato íntimo y recogido.

  Sobre una base de caliza porosa, el eje eleva una madera erosionada cuya oquedad central evoca una boca abierta en agonía. Al comprimir su escala, la fricción entre la piedra y la materia vegetal se vuelve más densa y cercana, ofreciendo una pieza de fuerte magnetismo pensada para habitar el espacio desde la serenidad de una emoción contenida.

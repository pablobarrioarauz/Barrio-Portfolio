titulo: Orden impreciso
tecnica: Mixta sobre lienzo
texto: |-
  Esta pieza plantea el equilibrio entre la estructura y el accidente sobre un plano de pigmentación terracota.

  Una geometría sutil y de trazo tenue intenta delimitar la superficie, pero se ve matizada por la densidad textural y las gradaciones del color. Esta red de líneas no busca una métrica rígida, sino establecer un orden impreciso: una estructura orgánica que se desdibuja y reaparece a través de la materia.

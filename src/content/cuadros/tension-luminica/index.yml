titulo: Tensión lumínica
tecnica: Mixta sobre lienzo
texto: |-
  En este díptico abordo el límite físico donde una masa de textura aprieta y aprisiona la retícula inferior. Ambos estratos quedan unificados bajo una misma capa monocroma, trasladando todo el protagonismo al comportamiento de la materia. 
   
  Sin distracción de color, es el impacto de los focos de luz el que activa esta presión: la iluminación incide sobre el relieve e ilumina la superficie, haciendo emerger la sombra de la geometría que pugna por salir desde la profundidad del lienzo.

titulo: Calma marina
tecnica: Mixta sobre lienzo
texto: |-
  En esta pieza trabajo con un plano de azul noche denso que evoca la inmensidad y la quietud del fondo oceánico.

  Sobre esa oscuridad imponente, una fina línea de horizonte y el trazado vertical en amarillo tenue irrumpen sin romper la serenidad de la masa pictórica. Me interesa ese contraste preciso: la presencia de un destello o punto de luz suspendido en la profundidad, pensado para aportar equilibrio, pausa y un centro de gravedad al espacio.

texto: |-
  En esta propuesta exploro la textura del soporte teñido con café, buscando una pátina cálida que evoque la superficie de los manuscritos antiguos.  

  Sobre esta base orgánica, los puntos de tinta y los trazos de lápiz se estructuran en una retícula fija. Me interesa el contraste entre lo impredecible de la mancha natural y la disciplina del signo repetido, planteando la pieza como una suerte de registro o lenguaje por descifrar.

titulo: Viento y marea
tecnica: Mixta sobre lienzo
texto: |-
  Estas piezas plantean la arena como un paisaje continuo y estable que articula los tres lienzos, sirviendo de base mineral para la irrupción del azul.

  Sobre esa superficie cálida y texturizada, la inmensidad del mar se materializa en el lienzo central a través de dos corrientes en azul profundo que compiten sin llegar a tocarse. Estas fuerzas no solo representan el movimiento del agua, sino que hacen hincapié en el tránsito de la gente de un lado al otro, generando un flujo constante de ida y vuelta. 

  En el centro, ambas trayectorias se aproximan hasta el límite extremo, sosteniendo una tensión espacial que se detiene justo en el punto de unión, sin llegar al contacto.

titulo: Fisura viva
tecnica: Óleo sobre lienzo
texto: |-
  Esta pieza plantea el contraste entre la serenidad de un plano neutro y la irrupción de una hendidura quebrada que atraviesa el lienzo.  

  Con una textura denso-calcárea de fondo, la grieta en verde oliva busca romper el estatismo de la superficie e inyectarle una tensión biológica. Lejos de ser una ruptura destructiva, la línea funciona como una vena en movimiento: la huella de lo vegetal abriéndose paso con fuerza a través de la materia.
